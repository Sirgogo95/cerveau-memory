{% if page.has_other_pages %}
  <nav class="pages" aria-label="Pages">
    {% if page.has_previous %}<a href="?{% if query %}q={{ query|urlencode }}&amp;{% endif %}status={{ status }}{% if kind %}&amp;type={{ kind|urlencode }}{% endif %}&amp;page={{ page.previous_page_number }}">Newer</a>{% endif %}
    <span>Page {{ page.number }} of {{ page.paginator.num_pages }}</span>
    {% if page.has_next %}<a href="?{% if query %}q={{ query|urlencode }}&amp;{% endif %}status={{ status }}{% if kind %}&amp;type={{ kind|urlencode }}{% endif %}&amp;page={{ page.next_page_number }}">Older</a>{% endif %}
  </nav>
{% endif %}
